# Local Postgres for development and self-hosting.
# Start: docker compose up -d    Stop: docker compose down
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: leetlog
      POSTGRES_PASSWORD: leetlog
      POSTGRES_DB: leetlog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetlog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
